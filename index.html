<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn Nhận Quà</title>
    <!-- Thư viện hiệu ứng pháo hoa ăn mừng -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        h1 { color: #d63031; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); text-align: center; }
        
        /* Giao diện vòng quay */
        .wheel-container { position: relative; width: 360px; height: 360px; margin-bottom: 20px; }
        #wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fdcb6e; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1); background: #fff; }
        
        /* Mũi tên định vị kết quả */
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 30px solid #d63031; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        
        /* Nút quay ở tâm */
        .spin-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: #d63031; border-radius: 50%; border: 4px solid #fff; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 5; user-select: none; }
        .spin-btn:active { transform: translate(-50%, -50%) scale(0.95); }

        /* Popup Form thông tin */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .popup-box { background: #fff; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transform: scale(0.8); transition: transform 0.3s ease; }
        .popup-overlay.show { opacity: 1; pointer-events: auto; }
        .popup-overlay.show .popup-box { transform: scale(1); }
        
        .popup-box h2 { color: #2d3436; margin-bottom: 10px; }
        .reward-announcement { font-size: 20px; color: #6c5ce7; font-weight: bold; margin-bottom: 20px; background: #f1f2f6; padding: 10px; border-radius: 8px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #636e72; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #dfe6e9; border-radius: 5px; font-size: 15px; outline: none; }
        .form-group input:focus { border-color: #6c5ce7; }
        
        .submit-btn { width: 100%; padding: 12px; background: #2ecc71; border: none; border-radius: 5px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2); }
        .submit-btn:hover { background: #27ae60; }
    </style>
</head>
<body>

    <h1>🎡 VÒNG QUAY MAY MẮN NHẬN QUÀ 🎁</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="360" height="360"></canvas>
        <div class="spin-btn" id="spinBtn">QUAY</div>
    </div>

    <!-- POPUP FORM HIỂN THỊ TRÊN MÀN HÌNH -->
    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <h2>🎉 Chúc Mừng Bạn!</h2>
            <p style="margin-bottom: 5px;">Bạn đã quay trúng phần quà:</p>
            <div class="reward-announcement" id="rewardText">Đang tải...</div>
            
            <form id="displayForm">
                <div class="form-group">
                    <label>Họ và Tên:</label>
                    <input type="text" id="fullname" placeholder="Nhập họ tên của bạn" required>
                </div>
                <div class="form-group">
                    <label>Số Điện Thoại:</label>
                    <input type="tel" id="phone" placeholder="Nhập số điện thoại liên hệ" required>
                </div>
                <div class="form-group">
                    <label>Địa chỉ Email:</label>
                    <input type="email" id="email" placeholder="Ví dụ: hoten@gmail.com" required>
                </div>
                <button type="submit" class="submit-btn">Xác Nhận Nhận Quà</button>
            </form>
        </div>
    </div>

    <!-- 🛡️ CƠ CHẾ IFRAME ẨN: Vượt lỗi bảo mật CORS từ ổ đĩa local -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { handleSuccess(); }"></iframe>
    
    <!-- 🔗 ĐÃ ĐỔI ĐUÔI LINK THÀNH /formResponse VÀ GHÉP ĐÚNG MÃ ENTRY THEO YÊU CẦU -->
    <form id="realGoogleForm" action="https://google.com" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="entry.2005620554" id="g_reward">  <!-- Câu hỏi: Phần quà -->
        <input type="hidden" name="entry.1045781291" id="g_name">    <!-- Câu hỏi: Họ tên -->
        <input type="hidden" name="entry.1065046570" id="g_phone">   <!-- Câu hỏi: Số điện thoại -->
        <input type="hidden" name="entry.1166974658" id="g_email">   <!-- Câu hỏi: Email -->
    </form>

    <script>
        var submitted = false;

        // Tùy chỉnh danh sách quà hiển thị trên vòng quay
        const rewards = [
            "Voucher 50K", "Móc Khóa Cute", "Chúc Bạn May Mắn", 
            "Áo Thun FreeSize", "Ly Sứ Cao Cấp", "Voucher 100K"
        ];
        
        const colors = ["#ff7675", "#74b9ff", "#a29bfe", "#ffeaa7", "#55efc4", "#fab1a0"];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const popup = document.getElementById("popup");
        const rewardText = document.getElementById("rewardText");
        const displayForm = document.getElementById("displayForm");

        const numSegments = rewards.length;
        const arcSize = (2 * Math.PI) / numSegments;
        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < numSegments; i++) {
                const angle = currentAngle + i * arcSize;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, canvas.height / 2);
                ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2, angle, angle + arcSize);
                ctx.lineTo(canvas.width / 2, canvas.height / 2);
                ctx.fill();

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#2d3436";
                ctx.font = "bold 14px Arial";
                ctx.fillText(rewards[i], canvas.width / 2 - 20, 5);
                ctx.restore();
            }
        }
        drawWheel();

        spinBtn.addEventListener("click", () => {
            if (isSpinning) return;
            isSpinning = true;

            const spinRounds = 6 + Math.floor(Math.random() * 4);
            const randomDegrees = Math.random() * 360;
            const totalTargetRotation = spinRounds * 360 + randomDegrees;

            const wheelStyle = document.getElementById("wheel").style;
            wheelStyle.transform = `rotate(${totalTargetRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                
                const actualDegrees = totalTargetRotation % 360;
                const normalizedAngle = (360 - actualDegrees + 270) % 360;
                const winningIndex = Math.floor((normalizedAngle / 360) * numSegments) % numSegments;
                const finalReward = rewards[winningIndex];

                rewardText.innerText = finalReward;
                popup.classList.add("show");
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                
                wheelStyle.transition = "none";
                wheelStyle.transform = `rotate(${actualDegrees}deg)`;
                setTimeout(() => { wheelStyle.transition = "transform 4s cubic-bezier(0.1, 0.8, 0.2, 1)"; }, 50);
            }, 4000);
        });

        // Xử lý chuyển tiếp dữ liệu
        displayForm.addEventListener("submit", (e) => {
            e.preventDefault();
            
            // Đồng bộ dữ liệu nhập vào Form ẩn của Google
            document.getElementById("g_reward").value = rewardText.innerText;
            document.getElementById("g_name").value = document.getElementById("fullname").value;
            document.getElementById("g_phone").value = document.getElementById("phone").value;
            document.getElementById("g_email").value = document.getElementById("email").value;

            // Bật cờ thông báo đã submit để kích hoạt hàm handleSuccess sau đó
            submitted = true;
            
            // Kích hoạt nộp lệnh submit chính thống của trình duyệt qua Iframe
            document.getElementById("realGoogleForm").submit();
        });

        // Chạy tự động sau khi Iframe nhận được tín hiệu phản hồi từ máy chủ Google
        function handleSuccess() {
